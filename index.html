<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CardFMV Tracker</title>
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#020617" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-24 select-none">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 space-y-3">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
          CardFMV
        </h1>
        <p class="text-[10px] text-slate-400">Market Price Intelligence</p>
      </div>
      <div class="flex items-center space-x-1.5 bg-emerald-950/70 border border-emerald-800/60 px-2 py-0.5 rounded-full">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[10px] font-semibold text-emerald-300">Live</span>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div id="filter-controls" class="space-y-2">
      <div class="relative">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search player, set, parallel..." 
          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
        />
      </div>
      <div class="flex gap-2">
        <select id="set-filter" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-[11px] text-slate-300 focus:outline-none focus:border-emerald-500">
          <option value="ALL">All Sets</option>
        </select>
        <select id="sort-select" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-[11px] text-slate-300 focus:outline-none focus:border-emerald-500">
          <option value="name">Name (A-Z)</option>
          <option value="high">Highest FMV</option>
          <option value="comps">Most Comps</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Card List Container -->
  <main class="flex-1 px-4 pt-4 space-y-3 max-w-md mx-auto w-full">
    <div id="loader" class="flex justify-center items-center py-20">
      <div class="w-8 h-8 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
    </div>
    
    <div id="cards-container" class="space-y-3 hidden"></div>
  </main>

  <!-- Bottom Navigation Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2.5 flex justify-around items-center max-w-md mx-auto">
    <!-- FMV Tab (Active) -->
    <button class="flex flex-col items-center text-emerald-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[10px] font-semibold mt-1">FMV</span>
    </button>
    <!-- Portfolio Tab -->
    <button class="flex flex-col items-center text-slate-500 hover:text-slate-300 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <span class="text-[10px] font-medium mt-1">Portfolio</span>
    </button>
    <!-- Trends Tab -->
    <button class="flex flex-col items-center text-slate-500 hover:text-slate-300 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span class="text-[10px] font-medium mt-1">Trends</span>
    </button>
  </nav>

  <script>
    const SUPABASE_URL = "https://jitybdvzprxuosrnosgv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FVLqmAx_FD2LugPTmg5yAg_6e3srN37";

    let allProcessedCards = [];

    async function initApp() {
      try {
        const client = window.supabase || supabase;
        const db = client.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { data: cards, error: errCards } = await db.from('cards').select('*');
        if (errCards) throw errCards;

        const { data: comps, error: errComps } = await db.from('sales_comps').select('*');
        if (errComps) throw errComps;

        // Process data
        allProcessedCards = (cards || []).map(card => {
          const cardComps = comps ? comps.filter(c => c.card_id === card.id) : [];
          const gradeGroups = {};

          cardComps.forEach(c => {
            if (!gradeGroups[c.grade]) gradeGroups[c.grade] = [];
            gradeGroups[c.grade].push(Number(c.total_cost));
          });

          let maxFMV = 0;
          let totalSales = 0;

          const gradeBadges = Object.keys(gradeGroups).map(grade => {
            const prices = gradeGroups[grade].sort((a, b) => a - b);
            const mid = Math.floor(prices.length / 2);
            const median = prices.length % 2 !== 0 ? prices[mid] : (prices[mid - 1] + prices[mid]) / 2;
            
            if (median > maxFMV) maxFMV = median;
            totalSales += prices.length;

            return { grade, median, count: prices.length };
          });

          return { ...card, grades: gradeBadges, maxFMV, totalSales };
        });

        // Populate set filter dropdown
        const sets = [...new Set(allProcessedCards.map(c => c.card_set))];
        const setSelect = document.getElementById('set-filter');
        sets.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          setSelect.appendChild(opt);
        });

        document.getElementById('loader').classList.add('hidden');
        document.getElementById('cards-container').classList.remove('hidden');

        renderCards();

        // Listeners for instant filtering
        document.getElementById('search-input').addEventListener('input', renderCards);
        document.getElementById('set-filter').addEventListener('change', renderCards);
        document.getElementById('sort-select').addEventListener('change', renderCards);

      } catch (err) {
        console.error(err);
      }
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedSet = document.getElementById('set-filter').value;
      const sort = document.getElementById('sort-select').value;

      let filtered = allProcessedCards.filter(card => {
        const matchesQuery = !query || 
          card.player_name.toLowerCase().includes(query) || 
          card.card_set.toLowerCase().includes(query) || 
          card.variation.toLowerCase().includes(query);

        const matchesSet = selectedSet === 'ALL' || card.card_set === selectedSet;
        return matchesQuery && matchesSet;
      });

      // Sorting
      if (sort === 'high') filtered.sort((a, b) => b.maxFMV - a.maxFMV);
      else if (sort === 'comps') filtered.sort((a, b) => b.totalSales - a.totalSales);
      else filtered.sort((a, b) => a.player_name.localeCompare(b.player_name));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">No matching cards found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(card => {
        const gradeList = card.grades.map(g => `
          <div class="flex items-center justify-between bg-slate-950/80 border border-slate-800/80 px-2.5 py-1.5 rounded-lg">
            <span class="text-[11px] font-semibold ${g.grade === 'PSA 10' ? 'text-amber-400' : 'text-slate-300'}">${g.grade}</span>
            <div class="text-right">
              <span class="text-xs font-bold text-slate-100">$${g.median.toFixed(2)}</span>
              <span class="text-[9px] text-slate-500 ml-1">(${g.count} sales)</span>
            </div>
          </div>
        `).join('');

        // Thumbnail image or placeholder
        const cardImage = card.image_url 
          ? `<img src="${card.image_url}" class="w-16 h-22 object-cover rounded-lg border border-slate-700/80 shadow" alt="${card.player_name}" />`
          : `<div class="w-16 h-22 bg-slate-800/90 border border-slate-700/60 rounded-lg flex flex-col items-center justify-center p-1 text-center shrink-0">
               <svg class="w-6 h-6 text-slate-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
               <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter line-clamp-1">${card.card_set.slice(0, 8)}</span>
             </div>`;

        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 shadow-md flex gap-3 items-start">
            ${cardImage}
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <span class="text-[9px] uppercase font-bold tracking-wider text-emerald-400 bg-emerald-950/80 border border-emerald-800/60 px-1.5 py-0.5 rounded">
                  ${card.card_year} ${card.card_set}
                </span>
              </div>
              <h2 class="text-sm font-bold text-slate-100 truncate mt-1">${card.player_name}</h2>
              <p class="text-[10px] text-slate-400 truncate mb-2">${card.variation} Parallel</p>
              
              <div class="space-y-1">
                ${gradeList || '<p class="text-[10px] text-slate-500">No comps</p>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    initApp();
  </script>
</body>
</html>
