<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CardFMV Tracker</title>
  
  <!-- Mobile PWA Standalone Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#020617" />

  <!-- Tailwind CSS & Supabase via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Prevent pull-to-refresh & give native mobile app feel */
    body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-24 select-none">

  <!-- Mobile Header -->
  <header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-5 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
        CardFMV
      </h1>
      <p class="text-[11px] text-slate-400">Live eBay Comps</p>
    </div>
    <div id="connection-status" class="flex items-center space-x-1.5 bg-emerald-950/70 border border-emerald-800/60 px-2.5 py-1 rounded-full">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-[10px] font-semibold text-emerald-300">Live</span>
    </div>
  </header>

  <!-- Card List Container -->
  <main class="flex-1 px-4 pt-4 space-y-4 max-w-md mx-auto w-full">
    <div id="loader" class="flex justify-center items-center py-20">
      <div class="w-8 h-8 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <div id="cards-container" class="space-y-4 hidden"></div>
  </main>

  <!-- Bottom Navigation Tab Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800 px-6 py-3 flex justify-around items-center max-w-md mx-auto">
    <button class="flex flex-col items-center text-emerald-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <span class="text-[10px] font-medium mt-1">Portfolio</span>
    </button>
    <button class="flex flex-col items-center text-slate-500">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span class="text-[10px] font-medium mt-1">Trends</span>
    </button>
  </nav>

  <script>
    // --- 1. CONFIGURATION ---
    const SUPABASE_URL = https://jitybdvzprxuosrnosgv.supabase.co/rest/v1/;
    const SUPABASE_ANON_KEY = sb_publishable_FVLqmAx_FD2LugPTmg5yAg_6e3srN37;

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2. FETCH & COMPUTE MEDIAN FMV ---
    async function loadCards() {
      const { data: cards, error: errCards } = await db.from('cards').select('*');
      const { data: comps, error: errComps } = await db.from('sales_comps').select('*');

      document.getElementById('loader').classList.add('hidden');
      const container = document.getElementById('cards-container');
      container.classList.remove('hidden');

      if (!cards || cards.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-sm">No cards tracked yet.</p>`;
        return;
      }

      container.innerHTML = cards.map(card => {
        const cardComps = comps ? comps.filter(c => c.card_id === card.id) : [];
        const gradeGroups = {};

        cardComps.forEach(c => {
          if (!gradeGroups[c.grade]) gradeGroups[c.grade] = [];
          gradeGroups[c.grade].push(Number(c.total_cost));
        });

        // Compute median per grade
        const gradeBadges = Object.keys(gradeGroups).map(grade => {
          const prices = gradeGroups[grade].sort((a, b) => a - b);
          const mid = Math.floor(prices.length / 2);
          const median = prices.length % 2 !== 0 ? prices[mid] : (prices[mid - 1] + prices[mid]) / 2;

          return `
            <div class="flex items-center justify-between bg-slate-950/80 border border-slate-800/80 px-3 py-2 rounded-xl">
              <span class="text-xs font-semibold ${grade === 'PSA 10' ? 'text-amber-400' : 'text-slate-300'}">${grade}</span>
              <div class="text-right">
                <span class="text-sm font-bold text-slate-100">$${median.toFixed(2)}</span>
                <span class="text-[10px] text-slate-500 ml-1">(${prices.length} sales)</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div>
              <span class="text-[10px] uppercase font-semibold tracking-wider text-emerald-400 bg-emerald-950/80 border border-emerald-800/60 px-2 py-0.5 rounded-md">
                ${card.card_year} ${card.card_set}
              </span>
              <h2 class="text-lg font-bold text-slate-100 mt-1">${card.player_name}</h2>
              <p class="text-xs text-slate-400">${card.variation} Parallel</p>
            </div>
            <div class="space-y-1.5 pt-2 border-t border-slate-800/60">
              ${gradeBadges || '<p class="text-xs text-slate-500">No sold comps yet</p>'}
            </div>
          </div>
        `;
      }).join('');
    }

    loadCards();
  </script>
</body>
</html>
